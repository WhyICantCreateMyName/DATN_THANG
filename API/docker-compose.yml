services:
  postgres:
    image: postgres:15-alpine
    container_name: restaurant_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: restaurant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: restaurant_minio
    ports:
      - "9000:9000" # Port để API gọi vào lưu/lấy ảnh
      - "9001:9001" # Port để truy cập giao diện web quản lý
    environment:
      MINIO_ROOT_USER: admin # Tài khoản đăng nhập
      MINIO_ROOT_PASSWORD: 12345678 # Mật khẩu (>8 ký tự)
    volumes:
      - minio_data:/data # Ánh xạ dữ liệu ra ngoài để không mất ảnh khi tắt Docker
    command: server /data --console-address ":9001"
volumes:
  postgres_data:
  minio_data:
